site_name: Pipeline Doctor
site_description: CI/CD Pipeline Diagnostics & Health Monitoring Tool
site_author: Pipeline Doctor Team
site_url: https://pipeline-doctor.readthedocs.io
repo_url: https://github.com/your-org/pipeline-doctor
repo_name: your-org/pipeline-doctor

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Platforms:
      - GitHub Actions: platforms/github.md
      - GitLab CI: platforms/gitlab.md
      - Jenkins: platforms/jenkins.md
      - Azure DevOps: platforms/azure-devops.md
      - CircleCI: platforms/circleci.md
  - Analyzers: analyzers.md
  - Reporters: reporters.md
  - Integrations: integrations.md
  - API Reference: api-reference.md
  - Architecture: architecture.md
  - Contributing: ../CONTRIBUTING.md
  - Changelog: ../CHANGELOG.md
  - License: ../LICENSE.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [../src]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: true
            heading_level: 2
  - mermaid2

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/pipeline-doctor
    - icon: fontawesome/brands/discord
      link: https://discord.gg/pipeline-doctor
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/pipeline-doctor/

copyright: Copyright &copy; 2024 Pipeline Doctor Team