stages:
  - lint
  - test
  - build
  - docker

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/
    - .pytest_cache/

lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install -e ".[dev]"
  script:
    - ruff check src tests
    - ruff format --check src tests

test:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -e ".[dev]"
  script:
    - pytest --cov=pipeline_doctor --cov-report=xml --cov-report=term-missing
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+\%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

test-matrix:
  stage: test
  image: python:3.11-slim
  parallel:
    matrix:
      - PYTHON_VERSION: "3.11"
      - PYTHON_VERSION: "3.12"
  before_script:
    - pip install -e ".[dev]"
  script:
    - pytest --cov=pipeline_doctor

build:
  stage: build
  image: python:3.11-slim
  needs: [lint, test]
  before_script:
    - pip install build twine
  script:
    - python -m build
    - twine check dist/*
  artifacts:
    paths:
      - dist/*
    expire_in: 1 week

docker:
  stage: docker
  image: docker:24-dind
  needs: [lint, test]
  services:
    - docker:24-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
    - tags