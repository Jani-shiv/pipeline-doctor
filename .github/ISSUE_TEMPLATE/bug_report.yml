name: Bug Report
description: Report a bug or issue with Pipeline Doctor
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below with as much detail as possible.
  
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true
  
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Run command `pipeline-doctor analyze ...`
        2. Observe error
        3. ...
    validations:
      required: true
  
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      placeholder: |
        - OS: [e.g., Ubuntu 22.04, macOS 14, Windows 11]
        - Python version: [e.g., 3.11.5]
        - Pipeline Doctor version: [e.g., 0.1.0]
        - Platform: [e.g., GitHub Actions, GitLab CI, Jenkins]
    validations:
      required: true
  
  - type: textarea
    id: logs
    attributes:
      label: Logs/Error Output
      description: Paste any relevant logs or error messages
      render: shell
      placeholder: |
        $ pipeline-doctor analyze ...
        Error: ...
  
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have provided all requested information
          required: true
        - label: I am using the latest version of Pipeline Doctor
          required: false