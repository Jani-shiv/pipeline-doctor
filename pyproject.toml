[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-doctor"
version = "0.1.0"
description = "CI/CD Pipeline Diagnostics & Health Monitoring Tool"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Pipeline Doctor Team", email = "team@pipeline-doctor.io"}
]
maintainers = [
    {name = "Pipeline Doctor Team", email = "team@pipeline-doctor.io"}
]
keywords = [
    "ci-cd", "pipeline", "diagnostics", "monitoring", "devops",
    "github-actions", "gitlab-ci", "jenkins", "azure-devops", "circleci"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "asyncio-throttle>=1.0.2",
    "tenacity>=8.2.0",
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
    "pandas>=2.1.0",
    "plotly>=5.17.0",
    "sqlite-utils>=3.37.0",
    "structlog>=24.1.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.6.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "types-requests>=2.31.0",
    "types-PyYAML>=6.0.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.24.0",
    "mkdocs-mermaid2-plugin>=1.1.0",
]
all = [
    "pipeline-doctor[dev,docs]",
]

[project.urls]
Homepage = "https://github.com/your-org/pipeline-doctor"
Repository = "https://github.com/your-org/pipeline-doctor"
Documentation = "https://pipeline-doctor.readthedocs.io"
Changelog = "https://github.com/your-org/pipeline-doctor/blob/main/CHANGELOG.md"
Issues = "https://github.com/your-org/pipeline-doctor/issues"
Discord = "https://discord.gg/pipeline-doctor"

[project.scripts]
pipeline-doctor = "pipeline_doctor.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pipeline_doctor*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=pipeline_doctor",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=15",
    "--cov-branch",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "github: Tests requiring GitHub API",
    "gitlab: Tests requiring GitLab API",
    "jenkins: Tests requiring Jenkins",
    "azure: Tests requiring Azure DevOps",
    "circleci: Tests requiring CircleCI",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "T20", # flake8-print
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default argument
    "TRY003", # specifying Exception
    "PLR0913", # too many arguments
    "PLR0917", # too many positional arguments
    "PLR0911", # too many return statements
    "PLR0912", # too many branches
    "PLR0915", # too many statements
    "PLR2004", # magic value
    "PLC0415", # import not at top level
    "PTH123",  # open() vs Path.open()
    "PTH118",  # os.path vs pathlib
    "B904",    # raise from err
    "B025",    # duplicate exception
    "B007",    # loop control variable not used
    "F821",    # undefined name
    "F401",    # unused import
    "F811",    # redefinition
    "I001",    # import block un-sorted
    "B008",    # function calls in default argument (already)
    "TRY003",  # specifying Exception (already)
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = false
follow_imports = "silent"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
warn_return_any = false

[tool.pre-commit-hooks]
repos = [
  {repo = "https://github.com/astral-sh/ruff-pre-commit", rev = "v0.1.0", hooks = [
    {id = "ruff", args = ["--fix", "--exit-non-zero-on-fix"]},
    {id = "ruff-format"},
  ]},
  {repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.5.0", hooks = [
    {id = "check-yaml"},
    {id = "check-toml"},
    {id = "check-json"},
    {id = "check-merge-conflict"},
    {id = "end-of-file-fixer"},
    {id = "trailing-whitespace"},
    {id = "mixed-line-ending", args = ["--fix=lf"]},
  ]},
  {repo = "https://github.com/psf/black", rev = "23.12.0", hooks = [
    {id = "black"},
  ]},
  {repo = "https://github.com/pycqa/isort", rev = "5.13.0", hooks = [
    {id = "isort"},
  ]},
]

[tool.coverage.run]
source = ["src/pipeline_doctor"]
omit = [
    "*/tests/*",
    "*/conftest.py",
    "src/pipeline_doctor/integrations/*",
    "src/pipeline_doctor/reporters/*",
    "src/pipeline_doctor/analyzers/*.py",
    "src/pipeline_doctor/cli/*",
]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"